<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' data: file: music-media: https://*.music.126.net https://*.music.163.net;media-src 'self' file: music-media:;object-src 'none';base-uri 'none'">
<title>音乐下载器 · 全屏歌词</title><link rel="stylesheet" href="fullscreen.css"><link rel="stylesheet" href="fonts.css"></head><body>
<video id="background-video" muted loop playsinline preload="auto" hidden></video><img id="background-image" alt="" hidden><div class="scrim"></div>
<header><button id="close" title="退出全屏，音乐继续播放">← 返回音乐 <kbd>Esc</kbd></button><img id="cover" src="../assets/avatar.png" alt="专辑封面" draggable="false"><div class="song"><h1 id="title">让音乐降落</h1><p id="artist">从音乐库选一首喜欢的歌</p><p id="state">等待播放</p></div></header>
<main id="lyrics" aria-label="同步歌词"><div id="lyric-list"></div></main>
<p id="background-status" hidden></p>
<footer><button id="previous" title="上一首" aria-label="上一首">❮</button><button id="toggle" title="播放" aria-label="播放"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="toggle-icon" d="m9 5 11 7-11 7Z"/></svg></button><button id="next" title="下一首" aria-label="下一首">❯</button><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1" value="0" step="0.1" aria-label="播放进度"><span id="duration">0:00</span><label class="volume">音量 <input id="volume" type="range" min="0" max="1" value=".75" step=".01" aria-label="音量"></label><button id="retry-lyrics" title="重新获取当前歌词">歌词 ↻</button></footer>
<script src="fullscreen.js"></script></body></html>
