<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' https://*.music.126.net https://*.music.163.net;media-src 'self' file: music-preview: music-media:;object-src 'none';base-uri 'none'">
<title>音乐下载器 · 下拉播放器</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="neon.css"></head><body>
<main class="panel">
<header id="anchor" title="拖动此处，沿屏幕顶部调整位置"><span class="wordmark"><img class="brand-icon" src="../assets/avatar.png" draggable="false" alt="原应用图标"><b>音乐下载器</b><small>NEON / MUSIC</small></span><div class="head-actions"><button id="tasks-button" title="下载任务" aria-label="下载任务">↓<i id="task-badge" hidden></i></button><button id="settings-button" title="设置" aria-label="设置">⚙</button><button id="collapse" title="收起到顶部" aria-label="收起到顶部">⌃</button></div></header>
<section class="player" aria-label="播放器">
<div class="hero"><div class="orbital-art"><div class="orbit orbit-one"></div><div class="orbit orbit-two"></div><div class="disc"><img id="cover" src="../assets/avatar.png" alt="专辑封面"></div><span class="orbit-point"></span></div><div class="track-copy"><div class="signal"><span id="signal-light"></span><span id="signal-label">STANDBY</span><span id="preview-tag" hidden>试听片段</span></div><h1 id="track-title">让音乐降落</h1><p id="track-artist">从下面选一首，留给此刻。</p><span id="track-source">YOUR PERSONAL FREQUENCY</span></div></div>
<button id="lyric-line" class="lyric-line" title="查看同步歌词">每一段旋律，都有自己的轨道。</button>
<div class="timeline"><input id="seek" type="range" min="0" max="1" step="0.1" value="0" disabled aria-label="播放进度"><div><span id="elapsed">0:00</span><span class="track-format" id="track-format">READY</span><span id="duration">0:00</span></div></div>
<div class="transport"><button id="mode" title="切换播放模式">顺序</button><button id="previous" aria-label="上一首" title="上一首"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 5 8 12l10 7Z"/></svg></button><button id="play" aria-label="播放或暂停" title="播放或暂停"><svg viewBox="0 0 24 24"><path id="play-path" d="m9 5 11 7-11 7Z"/></svg></button><button id="next" aria-label="下一首" title="下一首"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 5l10 7-10 7Z"/></svg></button><div class="volume"><button id="mute" title="静音" aria-label="静音">♪</button><input id="volume" type="range" min="0" max="1" step="0.01" value=".75" aria-label="音量"></div></div>
</section>
<nav class="tabs" aria-label="音乐内容"><button data-tab="local" class="active">音乐库</button><button data-tab="recent">新发现</button><button data-tab="search">搜索</button><button data-tab="queue">播放队列</button></nav>
<section id="browser" class="browser">
<div class="browser-toolbar" id="library-tools"><select id="playlist" aria-label="选择歌单"><option value="all">全部本地音乐</option></select><button id="new-playlist" title="新建歌单" aria-label="新建歌单">＋</button><button id="playlist-menu" title="管理当前歌单" aria-label="管理歌单">⋯</button><button id="import" title="导入本地音乐">导入</button></div>
<div class="browser-toolbar" id="online-tools" hidden><button id="load-online-playlist">打开网易云歌单</button><button id="download-list">下载当前列表</button></div>
<form id="search-form" class="searchbox"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="query" type="search" placeholder="筛选音乐库…" aria-label="查找歌曲" autocomplete="off"><button id="search-submit" type="submit" hidden>搜索</button></form>
<div class="section-label"><span id="list-title">YOUR COLLECTION</span><span id="list-count">0 首</span><button id="refresh" title="刷新列表">↻</button></div>
<div id="track-list" class="track-list" aria-live="polite"></div>
<div id="pagination" hidden><button id="page-prev">上一页</button><span id="page-label"></span><button id="page-next">下一页</button></div>
</section>
<section id="settings-view" class="sheet" hidden><div class="sheet-heading"><h2>偏好设置</h2><button class="back-button">返回</button></div><label>面板长度<select id="length-preset"><option value="520">紧凑 · 520</option><option value="740" selected>标准 · 740</option><option value="960">舒展 · 960</option></select></label><p class="hint">也可以拖住面板底边，连续调整长度。</p><label>音乐保存目录<input id="download-dir" readonly></label><div class="two-actions"><button id="choose-dir">更改目录</button><button id="open-dir">打开文件夹</button></div><label>同时下载<select id="parallel"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>6</option></select></label><label>自定义接口（可选，每行一个）<textarea id="api-bases" rows="2"></textarea></label><label class="switch"><input id="desktop-lyrics" type="checkbox">桌面悬浮歌词</label><label class="switch"><input id="lock-lyrics" type="checkbox">锁定桌面歌词（鼠标穿透）</label><button id="save-settings" class="accent-button">保存设置</button><button id="quit" class="quiet-button">停止播放并退出</button><p id="build-label" class="hint"></p></section>
<section id="tasks-view" class="sheet" hidden><div class="sheet-heading"><h2>下载任务</h2><button class="back-button">返回</button></div><div id="task-list"></div></section>
<section id="lyrics-view" class="sheet" hidden><div class="sheet-heading"><h2>同步歌词</h2><button class="back-button">返回</button></div><div id="lyrics-list"></div></section>
<div id="status" role="status">向下拉开你的音乐空间</div>
<footer><span class="footer-dot"></span><span>ORBIT  /  PERSONAL AUDIO</span><span id="height-label">740</span></footer>
<button id="resize-grip" aria-label="拖动调整面板高度" title="上下拖动调长短；方向键也可调整"><span></span><span></span></button>
</main>
<dialog id="dialog"><form method="dialog"><h2 id="dialog-title"></h2><p id="dialog-message"></p><input id="dialog-input" maxlength="32" autocomplete="off"><select id="dialog-select"></select><div><button value="cancel">取消</button><button id="dialog-confirm" value="ok" class="accent-button">确定</button></div></form></dialog>
<dialog id="welcome"><h2>音乐，从这里开始。</h2><p>拉动顶部挂件展开播放器，拖住底边调节长度。收起面板，音乐会继续。</p><p class="hint">本软件不是网易云官方客户端。请在获得授权及法律允许的范围内使用。音源受版权、会员与地区影响；试听片段会单独标注。</p><button id="accept" class="accent-button">开始听歌</button></dialog>
<audio id="music-audio" preload="metadata"></audio><script src="lrc.js"></script><script src="playback_navigation.js"></script><script src="playlist_queue.js"></script><script src="panel_player.js"></script><script src="panel.js"></script></body></html>
