<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self';img-src 'self' https://*.music.126.net https://*.music.163.net;object-src 'none'">
<title>音乐抽屉</title><link rel="stylesheet" href="mini-player.css"></head>
<body>
<button id="handle" aria-label="展开音乐抽屉" title="点击或向左拉出音乐"><span class="handle-mark">♫</span><span class="handle-dots">•••</span></button>
<main id="drawer" hidden>
<header><span class="brand">♫ <b>音乐抽屉</b><small>MUSIC, WITH YOU</small></span><div class="header-actions"><button id="pin" title="固定展开" aria-label="固定展开" aria-pressed="false">◇</button><button id="collapse" title="收起" aria-label="收起">›</button></div></header>
<section class="now-playing">
<div class="artwork"><img id="cover" src="../assets/avatar.png" alt="专辑封面"><span id="playing-badge">READY TO PLAY</span></div>
<div class="track-heading"><h1 id="name">音乐，随手可及</h1><p id="artist">从歌单选一首开始</p><span id="trial" hidden>试听片段</span></div>
<p id="lyric" class="lyric">给此刻一点旋律</p>
<div class="progress"><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="播放进度"><div><span id="current">0:00</span><span id="duration">0:00</span></div></div>
<div class="transport"><button id="mode" title="播放模式" aria-label="切换播放模式">顺序</button><button id="previous" title="上一首" aria-label="上一首">❮❮</button><button id="toggle" title="播放或暂停" aria-label="播放或暂停">▶</button><button id="next" title="下一首" aria-label="下一首">❯❯</button><button id="mute" title="静音" aria-label="静音">♪</button></div>
<div class="volume"><span>音量</span><input id="volume" type="range" min="0" max="1" step="0.01" value=".75" aria-label="音量"><span id="volume-label">75%</span></div>
</section>
<section class="library">
<nav><button id="tab-queue" class="selected">播放队列</button><button id="tab-library">本地音乐</button><span id="count">0 首</span></nav>
<select id="playlist" aria-label="选择本地歌单" hidden><option value="all">全部本地音乐</option></select>
<input id="filter" type="search" placeholder="找一首想听的歌…" aria-label="筛选歌曲">
<div id="songs"><p class="empty">打开音乐库，选一首喜欢的歌。<br>播放队列会在这里同步出现。</p></div>
</section>
<footer><button id="show-main">打开完整音乐库 ↗</button><button id="quit" title="停止播放并退出">退出</button></footer>
</main><script src="mini-player.js"></script></body></html>
