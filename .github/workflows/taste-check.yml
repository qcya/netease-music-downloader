name: Taste Discovery Verification
on:
  push:
    branches: ['fix/taste-discovery-v1.1.2']
    paths: ['.github/workflows/taste-check.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect anonymous search response shapes
        run: |
          node <<'JS'
          (async()=>{for(const path of ['/api/search/get/web','/api/search/get','/api/cloudsearch/pc'])for(const method of ['GET','POST']){try{const args=new URLSearchParams({s:'Alan Walker',type:'1',limit:'3',offset:'0'}),u='https://music.163.com'+path;const r=await fetch(u+(method==='GET'?'?'+args:''),{method,body:method==='POST'?args:undefined,headers:{'Referer':'https://music.163.com/'},signal:AbortSignal.timeout(7000)});const t=await r.text();console.log(JSON.stringify({path,method,status:r.status,sample:t.slice(0,2300)}));}catch(e){console.log(JSON.stringify({path,method,error:e.message}));}}})()
          JS
