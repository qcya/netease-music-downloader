name: Taste Discovery Verification
on:
  push:
    branches: ['fix/taste-discovery-v1.1.2']
    paths: ['.github/workflows/taste-check.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skill/requirements.txt pytest
      - name: Isolate first-run and restart verification modes
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/verify_packaged_playlist.js');s=p.read_text(encoding='utf8')
          a="    await wait('(async()=>{const s=await musicBridge.floatingLyricsStatus();return s.open&&s.visible&&s.loaded&&!s.locked;})()','First launch must show unlocked desktop lyrics');\n    console.log('PASS: clean installation starts with visible unlocked desktop lyrics.');"
          assert s.count(a)==1
          s=s.replace(a,"    if(process.argv[4]!=='restart'){\n"+a+"\n    }")
          a="    if(!(await c.run('musicBridge.floatingLyricsStatus()')).locked)await realClick('#toggle-desktop-lock');"
          assert s.count(a)==1
          b="""    const restartPages=await (await fetch('http://127.0.0.1:'+port+'/json/list')).json();
              const restartOverlay=restartPages.find(p=>/floating-lyrics\\.html/.test(p.url));
              const positionClient=await client(restartOverlay.webSocketDebuggerUrl);
              try{await positionClient.run('floatingBridge.dragBegin();floatingBridge.dragEnd();true');}
              finally{positionClient.close();}
              await wait('(async()=>!!(await musicBridge.getSettings()).floatingLyricsPosition)()','Lyric drag-end did not save coordinates');
          """
          # Normalize source indentation only; no product behavior is changed by this test update.
          s=s.replace(a,b+a)
          p.write_text(s,encoding='utf8')
      - name: Full regression tests
        env:
          PYTHONPATH: skill/scripts
          MUSIC_PYTHON_EXE: python
        run: |
          npm run check
          node --test tests/test_*.js
          python -m pytest -q tests
      - name: Commit verified test modes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_packaged_playlist.js
          git commit -m 'test: preserve explicit lyric position and distinguish first launch from restart'
          git push origin HEAD:fix/taste-discovery-v1.1.2
