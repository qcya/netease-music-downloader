name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python dependencies
        run: python -m pip install -r skill/requirements.txt pytest
      - name: Python integration tests
        env:
          PYTHONPATH: skill/scripts
        run: python -m pytest -q tests
      - name: Node syntax and tests
        env:
          MUSIC_PYTHON_EXE: python
        run: |
          npm run check
          node --test tests/test_*.js
