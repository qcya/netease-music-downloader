name: Electron Runtime Verification
on:
  push:
    branches: ['fix/stream-runtime-v111']
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skill/requirements.txt pytest
      - run: npm install --no-audit --no-fund
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - name: Verify isolated regression
        run: node --test tests/test_lyric_toggle_isolation.js tests/test_online_memory.js
      - name: Keep comparison process alive between windows
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/probe_stream_buffer.js')
          p.write_text(p.read_text(encoding='utf8').replace('let base,media,server;',"app.on('window-all-closed',()=>{});let base,media,server;"),encoding='utf8')
      - name: Compare Chromium demux startup with direct HTTP control
        shell: pwsh
        run: |
          $p=Start-Process node_modules/electron/dist/electron.exe -ArgumentList @('scripts/probe_stream_buffer.js') -RedirectStandardError runtime-stderr.log -RedirectStandardOutput runtime-stdout.log -PassThru
          try {
            if(!$p.WaitForExit(90000)){throw 'Transport comparison timed out'}
            if($p.ExitCode -ne 0){throw 'Transport comparison failed'}
          } finally {
            Get-Process -Name electron -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Content runtime-stdout.log -ErrorAction SilentlyContinue
            Get-Content runtime-stderr.log -ErrorAction SilentlyContinue | Select-Object -Last 30
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-diagnostics
          path: 'runtime-*.log'
          retention-days: 7
