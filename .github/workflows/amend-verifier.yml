name: Update Catalog Verifier
on:
  push:
    branches: ['fix/refresh-playlist-backend-v113']
    paths: ['.github/workflows/amend-verifier.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace obsolete verifier assumptions with new behavior assertions
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/verify_packaged_playlist.js');s=p.read_text()
          old="    fixture.offline();\n    await realClick('#discovery-refresh');\n    await wait('document.getElementById(\"discovery-state\").textContent.includes(\"缓存选曲\") && !document.getElementById(\"discovery-refresh\").disabled','Offline homepage did not show dated cache',200);"
          new="""    const beforeOffline=new Set(await c.run('[...document.querySelectorAll(\".discovery-song\")].map(e=>e.dataset.songId)'));
              fixture.offline();
              await realClick('#discovery-refresh');
              await wait('!document.getElementById(\"discovery-refresh\").disabled && document.querySelectorAll(\".discovery-song\").length===8','Saved candidate pool should continue to supply songs while offline',200);
              const offlineIDs=await c.run('[...document.querySelectorAll(\".discovery-song\")].map(e=>e.dataset.songId)');
              for(const id of offlineIDs)assert.ok(!beforeOffline.has(id),'offline refresh must not repeat the previous page');"""
          assert s.count(old)==1;s=s.replace(old,new)
          assert s.count("assert.equal(runtimeInfo.version,'1.1.2');")==1
          s=s.replace("assert.equal(runtimeInfo.version,'1.1.2');","assert.equal(runtimeInfo.version,require('../package.json').version);")
          s=s.replace('PASS: packaged offline cache fallback retains cards and shows actual cache date; build version','PASS: packaged offline refresh serves unseen saved candidates; build version')
          p.write_text(s)
      - run: |
          node --check scripts/verify_packaged_playlist.js
          node --test tests/test_catalog_preview_v113.js tests/test_refresh_playlist_backend_v113.js tests/test_taste_v112.js
      - name: Commit corrected regression expectations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/verify_packaged_playlist.js
          git commit -m 'test: assert unseen offline candidates and dynamic built version'
          git push origin HEAD:fix/refresh-playlist-backend-v113
