name: Verify Memory Stream Repair
on:
  push:
    branches: ['fix/lyrics-stream-v1.1.1']
    paths: ['.github/workflows/apply-v111.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Anonymous metadata and media availability
        run: |
          node <<'JS'
          const ids=['3392268481','3360869362','2103336805','347230','186016','33448965','22636664','536622304','1397744004','1405304658'];
          async function inspect(id){
            for(const route of ['player/url','player/url/v1']){
              const url='https://music.163.com/api/song/enhance/'+route+'?ids='+encodeURIComponent('['+id+']')+(route.endsWith('/v1')?'&level=standard&encodeType=mp3':'&br=128000');
              try{const r=await fetch(url,{cache:'no-store',signal:AbortSignal.timeout(8000)});const d=await r.json();const row=d.data?.[0];console.log(JSON.stringify({id,route,http:r.status,code:d.code,keys:Object.keys(d),row:row&&{id:row.id,code:row.code,hasURL:!!row.url,type:row.type,trial:row.freeTrialInfo,fee:row.fee,host:row.url?new URL(row.url).host:null},message:d.msg||d.message}));}catch(e){console.log(JSON.stringify({id,route,error:e.message}));}
            }
          }
          (async()=>{await Promise.all(ids.map(inspect));for(const path of ['/api/song/lyric?id=347230&lv=-1&kv=-1&tv=-1','/song/media/outer/url?id=347230.mp3']){try{const r=await fetch('https://music.163.com'+path,{redirect:'manual',signal:AbortSignal.timeout(8000)});const t=await r.text();console.log(JSON.stringify({path,status:r.status,type:r.headers.get('content-type'),location:r.headers.get('location'),sample:t.slice(0,200)}));}catch(e){console.log(e.message);}}})();
          JS
