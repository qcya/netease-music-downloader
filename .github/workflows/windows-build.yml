name: Build Windows Portable

on:
  # Release exactly once when the release workflow itself is merged.
  # Windows-compatible Electron test mocks have been verified before this retry.
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
  # Retain an artifact-only manual build for future testing.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-v1.0.6
  cancel-in-progress: false

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure release version matches package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "1.0.6") { throw "Wrong package version: $version" }
      - name: Install Python libraries
        run: python -m pip install -r skill/requirements.txt -r skill/requirements-build.txt pytest
      - name: Install npm libraries
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --no-audit --no-fund
      - name: Run all regression tests
        shell: pwsh
        env:
          MUSIC_PYTHON_EXE: python
          PYTHONPATH: skill/scripts
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax checks failed" }
          $testFiles = @(Get-ChildItem -Path tests -Filter 'test_*.js' | ForEach-Object { $_.FullName })
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { throw "Node tests failed" }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
      - name: Build standalone portable EXE
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Validate bundled backend, wallpaper, and single-file EXE
        shell: pwsh
        run: |
          $exe = "dist/MusicDownloader-1.0.6-portable.exe"
          $backend = "backend/music_backend.exe"
          $wallpaper = "assets/immersive-background-1080p.mp4"
          $asar = "dist/win-unpacked/resources/app.asar"
          foreach ($file in @($exe,$backend,$wallpaper,$asar)) {
            if (!(Test-Path $file)) { throw "Missing file: $file" }
          }
          if ((Get-Item $exe).Length -lt 30000000) { throw "Portable EXE unexpectedly small" }
          if ((Get-Item $wallpaper).Length -lt 100000) { throw "Missing expected video payload" }
          $info = & $backend --runtime-info | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$info.ok -or !$info.embedded) {
            throw "Embedded backend runtime verification failed"
          }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/MusicDownloader-1.0.6-portable.exe.sha256" -Encoding ascii -Value "$hash  MusicDownloader-1.0.6-portable.exe"
          Write-Host "Portable EXE SHA256: $hash"
      - name: Smoke-test installed portable executable and main-window exit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sample = "dist/MusicDownloader-1.0.6-portable.exe"
          $smokeDir = Join-Path $env:RUNNER_TEMP ("MusicDownloader-smoke-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $env:MUSIC_DOWNLOADER_TEST_USER_DATA = $smokeDir
          $log = Join-Path $smokeDir "logs/application.log"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeClose {
            [DllImport("user32.dll", SetLastError=true)]
            public static extern bool PostMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
          }
          '@
          Write-Host "Launching packaged EXE in a clean Windows user-data folder..."
          $launcher = Start-Process -FilePath (Resolve-Path $sample) -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern '"event":"window_ready"' -Quiet)) {
                $ready = $true
                break
              }
            }
            if (!$ready) {
              if (Test-Path $log) { Get-Content $log | Select-Object -Last 30 | Write-Host }
              throw "Packaged app did not reach a visible main window within 120 seconds"
            }
            Write-Host "Packaged EXE reached window_ready."
            $mainWindow = $null
            for ($i=0; $i -lt 25; $i++) {
              $mainWindow = Get-Process -Name MusicDownloader -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowHandle -ne [IntPtr]::Zero } |
                Select-Object -First 1
              if ($mainWindow) { break }
              Start-Sleep -Seconds 1
            }
            if (!$mainWindow) { throw "Packaged EXE has no discoverable main window handle" }
            Write-Host "Sending WM_CLOSE to actual main window PID $($mainWindow.Id)"
            if (![NativeClose]::PostMessage($mainWindow.MainWindowHandle,0x0010,[IntPtr]::Zero,[IntPtr]::Zero)) {
              throw "Could not send WM_CLOSE to main window"
            }
            $exited = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $alive = @(Get-Process -Name MusicDownloader -ErrorAction SilentlyContinue)
              if ($alive.Count -eq 0) { $exited = $true; break }
            }
            if (!$exited) { throw "Closing main window left MusicDownloader in background" }
            Write-Host "PASS: packaged app launched, displayed its window, and fully exited on close."
          } finally {
            Get-Process -Name MusicDownloader -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if ($launcher -and !$launcher.HasExited) { Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-Windows-Portable-v1.0.6
          path: |
            dist/MusicDownloader-1.0.6-portable.exe
            dist/MusicDownloader-1.0.6-portable.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release v1.0.6
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.6 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v1.0.6 already exists. Refusing to overwrite." }
          gh release create v1.0.6 "dist/MusicDownloader-1.0.6-portable.exe" "dist/MusicDownloader-1.0.6-portable.exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "音乐下载器 v1.0.6" --notes-file "RELEASE_NOTES_v1.0.6.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release" }
