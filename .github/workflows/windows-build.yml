name: Build Windows Portable

on:
  # Release exactly once when the release workflow itself is merged.
  # Windows-compatible Electron test mocks have been verified before this retry.
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
  # Retain an artifact-only manual build for future testing.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-v1.0.3
  cancel-in-progress: false

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure release version matches package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "1.0.3") { throw "Wrong package version: $version" }
      - name: Install Python libraries
        run: python -m pip install -r skill/requirements.txt -r skill/requirements-build.txt pytest
      - name: Install npm libraries
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --no-audit --no-fund
      - name: Run all regression tests
        shell: pwsh
        env:
          MUSIC_PYTHON_EXE: python
          PYTHONPATH: skill/scripts
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax checks failed" }
          $testFiles = @(Get-ChildItem -Path tests -Filter 'test_*.js' | ForEach-Object { $_.FullName })
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { throw "Node tests failed" }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
      - name: Build standalone portable EXE
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Validate bundled backend, wallpaper, and single-file EXE
        shell: pwsh
        run: |
          $exe = "dist/MusicDownloader-1.0.3-portable.exe"
          $backend = "backend/music_backend.exe"
          $wallpaper = "assets/immersive-background-1080p.mp4"
          $asar = "dist/win-unpacked/resources/app.asar"
          foreach ($file in @($exe,$backend,$wallpaper,$asar)) {
            if (!(Test-Path $file)) { throw "Missing file: $file" }
          }
          if ((Get-Item $exe).Length -lt 30000000) { throw "Portable EXE unexpectedly small" }
          if ((Get-Item $wallpaper).Length -lt 100000) { throw "Missing expected video payload" }
          $info = & $backend --runtime-info | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$info.ok -or !$info.embedded) {
            throw "Embedded backend runtime verification failed"
          }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/MusicDownloader-1.0.3-portable.exe.sha256" -Encoding ascii -Value "$hash  MusicDownloader-1.0.3-portable.exe"
          Write-Host "Portable EXE SHA256: $hash"
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-Windows-Portable-v1.0.3
          path: |
            dist/MusicDownloader-1.0.3-portable.exe
            dist/MusicDownloader-1.0.3-portable.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release v1.0.3
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.3 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v1.0.3 already exists. Refusing to overwrite." }
          gh release create v1.0.3 "dist/MusicDownloader-1.0.3-portable.exe" "dist/MusicDownloader-1.0.3-portable.exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "音乐下载器 v1.0.3" --notes-file "RELEASE_NOTES_v1.0.3.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release" }
