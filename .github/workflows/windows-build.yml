name: Build Windows Portable
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skill/requirements.txt -r skill/requirements-build.txt pytest
      - run: npm ci --no-audit --no-fund
      - name: Run all regression tests
        shell: pwsh
        env:
          MUSIC_PYTHON_EXE: python
          MUSIC_DOWNLOADER_RUN_ELECTRON_STORAGE_TEST: '1'
        run: |
          npm run check
          if ($LASTEXITCODE) { throw 'Syntax check failed' }
          npm test
          if ($LASTEXITCODE) { throw 'Node tests failed' }
          python -m pytest -q tests
          if ($LASTEXITCODE) { throw 'Python tests failed' }
          npm run build:muonium
          if ($LASTEXITCODE) { throw 'Original NetEase backend build failed' }
          foreach ($script in @('verify_neutral_glass.js','verify_overlay_runtime.js','verify_muonium_layout.js','verify_netease_hub.js','verify_account_panel.js','verify_reference_revision.js')) {
            $p = Start-Process node_modules/electron/dist/electron.exe -ArgumentList "scripts/$script" -WindowStyle Hidden -PassThru -Wait
            if ($p.ExitCode) { throw "Integration test failed: $script" }
          }
      - name: Build extract-and-run ZIP
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Verify packaged player and embedded downloader
        shell: pwsh
        run: |
          $exe = 'dist/win-unpacked/青春沿岸の音乐播放器.exe'
          $testDir = Join-Path $env:RUNNER_TEMP 'orbit-packaged-test'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          @{ downloadDir=(Join-Path $testDir 'music'); desktopLyricsEnabled=$false; disclaimerAcceptedVersion=1 } | ConvertTo-Json | Set-Content (Join-Path $testDir 'settings.json') -Encoding utf8
          $env:MUSIC_DOWNLOADER_TEST_USER_DATA = $testDir
          $env:MUSIC_DOWNLOADER_TEST_HIDE_WINDOWS = '1'
          $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList @('--remote-debugging-port=19273','--show') -WindowStyle Hidden -PassThru
          try {
            node scripts/verify_reference_package.js 19273 $testDir
            if ($LASTEXITCODE) { throw 'Packaged panel test failed' }
            if (!$p.WaitForExit(30000)) { throw 'Packaged application did not exit' }
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Copy-Item (Join-Path $testDir 'packaged-result.json') packaged-result.json -ErrorAction SilentlyContinue
          }
          $archive = 'dist/青春沿岸の音乐播放器-2.2.0-preview.10-win64.zip'
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$archive.sha256", "$hash  $(Split-Path $archive -Leaf)" + [Environment]::NewLine, [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orbit-Windows-2.2.0-preview.10
          path: |
            dist/青春沿岸の音乐播放器-2.2.0-preview.10-win64.zip
            dist/青春沿岸の音乐播放器-2.2.0-preview.10-win64.zip.sha256
            .validation/panel-result.json
            .validation/panel-*.png
            packaged-result.json
          if-no-files-found: warn
