name: Build Windows Portable

on:
  # Rebuild v1.1.2 with isolated lyric settings and progressive-stream verification.
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-build.yml'
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-portable-v1.1.2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure release version matches package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -ne "1.1.2") { throw "Wrong package version: $version" }
      - name: Install Python libraries
        run: python -m pip install -r skill/requirements.txt -r skill/requirements-build.txt pytest
      - name: Install npm libraries
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
        run: npm install --no-audit --no-fund
      - name: Run all regression tests
        shell: pwsh
        env:
          MUSIC_PYTHON_EXE: python
          PYTHONPATH: skill/scripts
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax checks failed" }
          $testFiles = @(Get-ChildItem -Path tests -Filter 'test_*.js' | ForEach-Object { $_.FullName })
          node --test @testFiles
          if ($LASTEXITCODE -ne 0) { throw "Node tests failed" }
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { throw "Python tests failed" }
      - name: Verify live taste metadata (informational)
        continue-on-error: true
        env:
          MUSIC_TASTE_EVIDENCE: packaged-taste-online.json
        run: node scripts/check_taste_online.js
      - name: Probe anonymous online audio and lyric availability (informational)
        continue-on-error: true
        run: node scripts/probe_online_stream.js
      - name: Build standalone portable EXE
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Validate bundled backend, wallpaper, and single-file EXE
        shell: pwsh
        run: |
          $exe = "dist/MusicDownloader-1.1.2-portable.exe"
          $backend = "backend/music_backend.exe"
          $wallpaper = "assets/immersive-background-1080p.mp4"
          $asar = "dist/win-unpacked/resources/app.asar"
          foreach ($file in @($exe,$backend,$wallpaper,$asar)) {
            if (!(Test-Path $file)) { throw "Missing file: $file" }
          }
          if ((Get-Item $exe).Length -lt 30000000) { throw "Portable EXE unexpectedly small" }
          if ((Get-Item $wallpaper).Length -lt 100000) { throw "Missing expected video payload" }
          $info = & $backend --runtime-info | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$info.ok -or !$info.embedded) {
            throw "Embedded backend runtime verification failed"
          }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/MusicDownloader-1.1.2-portable.exe.sha256" -Encoding ascii -Value "$hash  MusicDownloader-1.1.2-portable.exe"
          Write-Host "Portable EXE SHA256: $hash"
      - name: Smoke-test installed portable executable and main-window exit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sample = "dist/MusicDownloader-1.1.2-portable.exe"
          $smokeDir = Join-Path $env:RUNNER_TEMP ("MusicDownloader-smoke-" + $env:GITHUB_RUN_ID)
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          $env:MUSIC_DOWNLOADER_TEST_USER_DATA = $smokeDir
          $log = Join-Path $smokeDir "logs/application.log"
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeClose {
            [DllImport("user32.dll", SetLastError=true)]
            public static extern bool PostMessage(IntPtr window, uint message, IntPtr wParam, IntPtr lParam);
          }
          '@
          Write-Host "Launching packaged EXE in a clean Windows user-data folder..."
          $debugPort = 19273
          $launcher = Start-Process -FilePath (Resolve-Path $sample) -ArgumentList @("--remote-debugging-port=$debugPort", "--remote-allow-origins=*") -PassThru
          try {
            $ready = $false
            for ($i=0; $i -lt 120; $i++) {
              Start-Sleep -Seconds 1
              if ((Test-Path $log) -and (Select-String -Path $log -Pattern '"event":"window_ready"' -Quiet)) {
                $ready = $true
                break
              }
            }
            if (!$ready) {
              if (Test-Path $log) { Get-Content $log | Select-Object -Last 30 | Write-Host }
              throw "Packaged app did not reach a visible main window within 120 seconds"
            }
            Write-Host "Packaged EXE reached window_ready."
            node scripts/verify_packaged_playlist.js $debugPort $smokeDir 2>&1 | Tee-Object packaged-e2e.log
            if ($LASTEXITCODE -ne 0) { throw "Packaged lyrics, memory streaming or playlist test failed end-to-end" }
            Write-Host "PASS: Packaged playlist button E2E test."
            node -e "require('./scripts/native_test_window').setWindowState('MusicDownloader',16)"
            if ($LASTEXITCODE -ne 0) { throw "Could not send WM_CLOSE to actual main window" }
            $exited = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              $alive = @(Get-Process -Name MusicDownloader -ErrorAction SilentlyContinue)
              if ($alive.Count -eq 0) { $exited = $true; break }
            }
            if (!$exited) { throw "Closing main window left MusicDownloader in background" }
            Write-Host "PASS: packaged app launched, displayed its window, and fully exited on close."
            Write-Host "Relaunching the same EXE and saved user-data directory..."
            $launcher = Start-Process -FilePath (Resolve-Path $sample) -ArgumentList @("--remote-debugging-port=$debugPort", "--remote-allow-origins=*") -PassThru
            node scripts/verify_packaged_playlist.js $debugPort $smokeDir restart 2>&1 | Tee-Object -Append packaged-e2e.log
            if ($LASTEXITCODE -ne 0) { throw "Restart lost the user's lyric lock or position" }
            node -e "require('./scripts/native_test_window').setWindowState('MusicDownloader',16)"
            if ($LASTEXITCODE -ne 0) { throw "Could not close restarted main window" }
            $exited = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if (@(Get-Process -Name MusicDownloader -ErrorAction SilentlyContinue).Count -eq 0) { $exited = $true; break }
            }
            if (!$exited) { throw "Restarted player left background processes" }
          } finally {
            Get-Process -Name MusicDownloader -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
            if ($launcher -and !$launcher.HasExited) { Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue }
            $shot = Join-Path $smokeDir 'desktop-lyrics-minimized.png'
            if (Test-Path $shot) { Copy-Item $shot packaged-desktop-lyrics.png }
            if (Test-Path $log) { Copy-Item $log packaged-application.log }
          }
      - name: Preserve packaged verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Packaged-Lyrics-Stream-Evidence-v1.1.2
          path: |
            packaged-*.log
            packaged-*.png
            packaged-*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicDownloader-Windows-Portable-v1.1.2
          path: |
            dist/MusicDownloader-1.1.2-portable.exe
            dist/MusicDownloader-1.1.2-portable.exe.sha256
          if-no-files-found: error
      - name: Publish GitHub Release v1.1.2
        if: success() && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.1.2 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v1.1.2 already exists. Refusing to overwrite." }
          gh release create v1.1.2 "dist/MusicDownloader-1.1.2-portable.exe" "dist/MusicDownloader-1.1.2-portable.exe.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "音乐下载器 v1.1.2" --notes-file "RELEASE_NOTES_v1.1.2.md" --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release" }
