name: Build Windows Portable
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r skill/requirements.txt -r skill/requirements-build.txt pytest
      - run: npm ci --no-audit --no-fund
      - name: Run all regression tests
        shell: pwsh
        env:
          MUSIC_PYTHON_EXE: python
        run: |
          npm run check
          if ($LASTEXITCODE) { throw 'Syntax check failed' }
          npm test
          if ($LASTEXITCODE) { throw 'Node tests failed' }
          python -m pytest -q tests
          if ($LASTEXITCODE) { throw 'Python tests failed' }
          $p = Start-Process node_modules/electron/dist/electron.exe -ArgumentList 'scripts/verify_top_panel.js' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode) { throw 'Top panel interaction test failed' }
          $p = Start-Process node_modules/electron/dist/electron.exe -ArgumentList 'scripts/verify_discovery_panel.js' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode) { throw 'Discovery interaction test failed' }
          $p = Start-Process node_modules/electron/dist/electron.exe -ArgumentList 'scripts/verify_lyrics_transition.js' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode) { throw 'Desktop lyrics transition test failed' }
          $p = Start-Process node_modules/electron/dist/electron.exe -ArgumentList 'scripts/verify_account_panel.js' -WindowStyle Hidden -PassThru -Wait
          if ($p.ExitCode) { throw 'Account login and playback test failed' }
          $env:MUSIC_DOWNLOADER_TEST_USER_DATA = Join-Path $env:RUNNER_TEMP 'orbit-first-position-test'
          foreach ($phase in @('first','second')) {
            $p = Start-Process node_modules/electron/dist/electron.exe -ArgumentList @('scripts/verify_lyric_first_position_startup.js',$phase) -WindowStyle Hidden -PassThru -Wait
            if ($p.ExitCode) { throw "Desktop lyrics startup test failed: $phase" }
          }
          Remove-Item Env:MUSIC_DOWNLOADER_TEST_USER_DATA
      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win
      - name: Verify packaged player and embedded downloader
        shell: pwsh
        run: |
          $exe = 'dist/MusicDownloader-2.0.0-preview.12-portable.exe'
          $testDir = Join-Path $env:RUNNER_TEMP 'orbit-packaged-test'
          New-Item -ItemType Directory -Force -Path $testDir | Out-Null
          @{ downloadDir=(Join-Path $testDir 'music'); desktopLyricsEnabled=$false; disclaimerAcceptedVersion=1 } | ConvertTo-Json | Set-Content (Join-Path $testDir 'settings.json') -Encoding utf8
          $env:MUSIC_DOWNLOADER_TEST_USER_DATA = $testDir
          $p = Start-Process -FilePath (Resolve-Path $exe) -ArgumentList '--remote-debugging-port=19273' -WindowStyle Hidden -PassThru
          try {
            node scripts/check_packaged_panel.js 19273 $testDir
            if ($LASTEXITCODE) { throw 'Packaged panel test failed' }
            if (!$p.WaitForExit(30000)) { throw 'Packaged application did not exit' }
          } finally {
            if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }
            Copy-Item (Join-Path $testDir 'packaged-result.json') packaged-result.json -ErrorAction SilentlyContinue
          }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $exe -Leaf)" | Set-Content "$exe.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orbit-Windows-2.0.0-preview.12
          path: |
            dist/MusicDownloader-2.0.0-preview.12-portable.exe
            dist/MusicDownloader-2.0.0-preview.12-portable.exe.sha256
            .validation/panel-result.json
            .validation/panel-*.png
            packaged-result.json
          if-no-files-found: warn
