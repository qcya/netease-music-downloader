name: Development Verification
on:
  push:
    branches: ['feat/discovery-stability-v1.1.0']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Archive exact reviewed source
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: source.zip
          retention-days: 7
      - run: python -m pip install -r skill/requirements.txt pytest
      - name: Baseline and regression tests
        env:
          PYTHONPATH: skill/scripts
          MUSIC_PYTHON_EXE: python
        run: |
          npm run check
          node --test tests/test_*.js
          python -m pytest -q tests
