name: Recover Reviewed Implementation
on:
  push:
    branches: ['feat/discovery-stability-v1.1.0']
    paths: ['.github/workflows/recover-reviewed-patch.yml']
permissions:
  contents: write
concurrency:
  group: recover-discovery-v110
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skill/requirements.txt pytest
      - name: Decode and integrity-check reviewed patch
        shell: python
        run: |
          import base64, lzma, hashlib, pathlib, os, subprocess
          root=pathlib.Path('.ci-transfer')
          packed=''.join((root/f'part{i}.txt').read_text().strip() for i in range(1,5))
          patch=lzma.decompress(base64.b64decode(packed,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='f76a2c9c2d28eac3234f308758cab724feecb953c44820a6276db7ced462361e'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'reviewed.patch'
          target.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(target)],check=True)
          subprocess.run(['git','apply','--stat',str(target)],check=True)
      - name: Verify new regression tests fail on old implementation
        shell: bash
        run: |
          set -euo pipefail
          git apply --include=tests/test_stability_v110.js --include=tests/test_discovery_service.js "$RUNNER_TEMP/reviewed.patch"
          set +e
          node --test tests/test_stability_v110.js tests/test_discovery_service.js > "$RUNNER_TEMP/regression-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/regression-red.log"
          test "$status" -ne 0
          rm tests/test_stability_v110.js tests/test_discovery_service.js
      - name: Apply implementation and verify complete suite
        env:
          PYTHONPATH: skill/scripts
          MUSIC_PYTHON_EXE: python
        run: |
          git apply "$RUNNER_TEMP/reviewed.patch"
          npm run check
          node --test tests/test_*.js
          python -m pytest -q tests
      - name: Probe live public recommendation metadata
        continue-on-error: true
        run: node scripts/check_discovery_online.js
      - name: Commit only verified product changes on isolated branch
        run: |
          git restore .github/workflows/windows-build.yml
          git rm -r .ci-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --stat
          git commit -m 'feat: daily discovery homepage, durable playlists and stable playback queues'
          git push origin HEAD:feat/discovery-stability-v1.1.0
      - name: Archive verified source
        run: git archive --format=zip --output="$RUNNER_TEMP/verified-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: verified-implementation
          path: |
            ${{ runner.temp }}/verified-source.zip
            ${{ runner.temp }}/regression-red.log
          retention-days: 7
