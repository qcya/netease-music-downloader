name: Verify Refresh and Backend Repair
on:
  push:
    branches: ['fix/refresh-playlist-backend-v113']
    paths: ['.github/workflows/apply-v113.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r skill/requirements.txt pytest
      - name: Verify patch integrity and apply reviewed files
        shell: python
        run: |
          import pathlib,base64,lzma,hashlib,subprocess,os
          raw=''.join(pathlib.Path(f'.repair-transfer/part{i}.txt').read_text().strip() for i in range(1,4))
          patch=lzma.decompress(base64.b64decode(raw,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='75471594b3399e4bafe36ce53fb176b5165efa7dbb7f8db72722e942ba7a24e2'
          file=pathlib.Path(os.environ['RUNNER_TEMP'])/'v113.patch';file.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(file)],check=True)
          subprocess.run(['git','apply',str(file)],check=True)
          subprocess.run(['git','diff','--stat'],check=True)
      - name: Complete regression suite
        env:
          MUSIC_PYTHON_EXE: python
          PYTHONPATH: skill/scripts
        run: |
          npm run check
          node --test tests/test_*.js
          python -m pytest -q tests
      - name: Measure real metadata playlist counts and repeated recommendations
        continue-on-error: true
        run: node scripts/check_v113_online.js
      - name: Commit only regression-verified product changes
        run: |
          git rm -r .repair-transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.js' '*.json' '*.md' '*.bat' app tests scripts
          git diff --cached --stat
          git commit -m 'fix: prevent duplicate-launch resource loss and load fresh full music catalogs'
          git push origin HEAD:fix/refresh-playlist-backend-v113
      - name: Archive verification source
        run: git archive --format=zip --output=verified-source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v113-source-and-online-evidence
          path: |
            verified-source.zip
            v113-online-evidence.json
          retention-days: 14
