name: Reproduce Portable Backend Failure
on:
  push:
    branches: ['fix/refresh-playlist-backend-v113']
    paths: ['.github/workflows/reproduce-portable.yml']
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact baseline
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: repair-baseline
          path: source.zip
          retention-days: 7
      - name: Reproduce double launch without touching user data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          gh release download v1.1.2 -p '*portable.exe' --repo $env:GITHUB_REPOSITORY -D old
          if($LASTEXITCODE -ne 0){throw 'Old release download failed'}
          $exe=(Get-Item old/*portable.exe).FullName
          $env:MUSIC_DOWNLOADER_TEST_USER_DATA=Join-Path $env:RUNNER_TEMP 'v112-repro-clean'
          New-Item -ItemType Directory -Force $env:MUSIC_DOWNLOADER_TEST_USER_DATA | Out-Null
          try {
            $first=Start-Process $exe -ArgumentList '--remote-debugging-port=19313' -PassThru
            $main=$null
            for($i=0;$i -lt 80;$i++){
              Start-Sleep -Seconds 1
              $main=Get-CimInstance Win32_Process -Filter "name='MusicDownloader.exe'" | Where-Object { $_.CommandLine -notmatch '--type=' } | Select-Object -First 1
              if($main -and (Test-Path (Join-Path $env:MUSIC_DOWNLOADER_TEST_USER_DATA 'logs/application.log'))){break}
            }
            if(!$main){throw 'Old app never launched'}
            Start-Sleep -Seconds 5
            $resources=Join-Path (Split-Path $main.ExecutablePath) 'resources'
            $backend=Join-Path $resources 'backend/music_backend.exe'
            $cwd=Join-Path $resources 'skill/scripts'
            $before=@{stage='before';backendExists=(Test-Path $backend);cwdExists=(Test-Path $cwd);path=$backend}
            $before | ConvertTo-Json -Compress | Tee-Object repro.log
            $second=Start-Process $exe -PassThru
            if(!$second.WaitForExit(60000)){throw 'Second launch did not exit'}
            Start-Sleep -Seconds 3
            $after=@{stage='after-second-launch';backendExists=(Test-Path $backend);cwdExists=(Test-Path $cwd);firstProcessAlive=[bool](Get-Process -Id $main.ProcessId -ErrorAction SilentlyContinue)}
            $after | ConvertTo-Json -Compress | Tee-Object -Append repro.log
            if(!$before.backendExists){throw 'Baseline missing backend before second launch'}
            if($after.backendExists -and $after.cwdExists){Write-Host 'NOT REPRODUCED: investigate a different cause'}else{Write-Host 'REPRODUCED: second portable launcher removes resources used by the first process'}
          } finally {
            Get-Process -Name MusicDownloader -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-reproduction
          path: repro.log
          retention-days: 14
