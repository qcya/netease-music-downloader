name: Connect Public Discovery
on:
  push:
    branches: ['feat/discovery-stability-v1.1.0']
    paths: ['.github/workflows/connect-public-discovery.yml']
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connect reviewed public metadata adapter
        shell: python
        run: |
          from pathlib import Path
          def patch(file, old, new):
              p=Path(file);s=p.read_text()
              assert s.count(old)==1, file
              p.write_text(s.replace(old,new))
          patch('preload.js',"  discovery:options=>ipcRenderer.invoke('discovery:get',options),","  discovery:options=>ipcRenderer.invoke('discovery:get',options),\n  discoveryPlaylist:id=>ipcRenderer.invoke('discovery:playlist',id),")
          patch('main.js',"  ipcMain.handle('discovery:get',(_e,options)=>{assertMainSender(_e);return discovery.get(options||{})});","  ipcMain.handle('discovery:get',(_e,options)=>{assertMainSender(_e);return discovery.get(options||{})});\n  ipcMain.handle('discovery:playlist',(_e,id)=>{assertMainSender(_e);return discovery.playlist(id)});")
          patch('app/renderer.js','          await playlist();', """          setBusy(true,'正在读取公开歌单…');
                    try{
                      const res=await bridge.discoveryPlaylist(list.id);
                      showTracks(res.tracks,res.total);state.playlist=true;
                      $('#page-prev').disabled=true;$('#page-next').disabled=true;$('#page-label').textContent='歌单曲目';
                      if(res.possibly_incomplete)showToast('公开接口只返回了部分歌曲，当前展示 '+res.tracks.length+' 首。');
                      setStatus('已读取「'+list.name+'」：'+res.tracks.length+' 首，可选择下载。','ok');
                    }catch(e){showToast('歌单读取失败：'+errMessage(e),true);setStatus('歌单读取失败，可返回发现页重试。','error');}
                    finally{setBusy(false);}""")
          patch('scripts/verify_browser_ui.py',' playlist:async',' discoveryPlaylist:async')
          patch('scripts/verify_packaged_playlist.js','Recommended playlist did not reach actual Python playlist loader','Recommended playlist did not reach the public metadata service')
          patch('scripts/check_discovery_online.js','console.log(JSON.stringify({live:true',"if(!data.ok||!data.songs.length||!data.playlists.length)throw Error(data.message);const detail=await service.playlist(data.playlists[0].id);console.log(JSON.stringify({detailTracks:detail.tracks.length,live:true")
      - name: Syntax and public response regression tests
        run: |
          npm run check
          node --test tests/test_discovery_public.js tests/test_discovery_service.js tests/test_stability_v110.js
      - name: Verify real homepage metadata and selected playlist detail
        run: node scripts/check_discovery_online.js
      - name: Save verified wiring on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preload.js main.js app/renderer.js scripts/verify_browser_ui.py scripts/verify_packaged_playlist.js scripts/check_discovery_online.js
          git commit -m 'fix: connect daily discovery and playlist details to verified public metadata'
          git push origin HEAD:feat/discovery-stability-v1.1.0
